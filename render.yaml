services:
  - type: web
    name: sicetac-api-mcp
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SICETAC_API_ACCESS_MODE
        sync: false
      - key: SICETAC_API_KEYS_JSON
        sync: false
      - key: SICETAC_API_CONSUMERS_DB
        sync: false
      - key: SICETAC_USAGE_PERSISTENCE
        sync: false
      - key: SICETAC_ADMIN_TOKEN
        sync: false
